# krishnasbliss.com — main production site
# Symlink to /etc/nginx/sites-enabled/ after copying.
# Replace vagarwal with your Linux username if different.

server {
    listen 80;
    listen 443 ssl;
    server_name www.krishnasbliss.com;
    ssl_certificate     /etc/letsencrypt/live/krishnasbliss.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/krishnasbliss.com/privkey.pem;
    return 301 https://krishnasbliss.com$request_uri;
}

server {
    listen 80;
    server_name krishnasbliss.com;
    return 301 https://krishnasbliss.com$request_uri;
}

server {
    listen 443 ssl;
    server_name krishnasbliss.com;

    ssl_certificate     /etc/letsencrypt/live/krishnasbliss.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/krishnasbliss.com/privkey.pem;

    # Serve product images directly from disk — zero Node.js involvement.
    # Next.js image optimisation is disabled (unoptimized: true) so the browser
    # requests these URLs directly. nginx sends from disk in <5ms and the
    # browser caches for 1 year.
    location /uploads/ {
        alias /home/vagarwal/krishnabyrr/api/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
