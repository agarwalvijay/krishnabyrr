# dlapp.krishnasbliss.com — static app-download redirect page
# 1. Copy this file to /etc/nginx/sites-available/dlapp.krishnasbliss.com
# 2. ln -s /etc/nginx/sites-available/dlapp.krishnasbliss.com /etc/nginx/sites-enabled/
# 3. nginx -t && systemctl reload nginx
# 4. certbot --nginx -d dlapp.krishnasbliss.com
# 5. nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name dlapp.krishnasbliss.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        root /home/vagarwal/krishnabyrr/apps/dlapp;
        index index.html;
        try_files $uri /index.html;

        # Prevent caching so app store URL changes take effect immediately
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
