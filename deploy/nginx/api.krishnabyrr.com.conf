# api.krishnabyrr.com — Express API + uploads
# Replace YOUR_USER with your Linux username before copying to /etc/nginx/sites-available/

server {
    listen 80;
    server_name api.krishnabyrr.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Serve uploaded images directly from disk (bypasses Node)
    location /uploads/ {
        alias /home/YOUR_USER/krishnabyrr/api/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }
}
