# krishnabyrr.com — Next.js web app
# Replace YOUR_USER with your Linux username before copying to /etc/nginx/sites-available/

server {
    listen 80;
    server_name krishnabyrr.com www.krishnabyrr.com krishnasbliss.com www.krishnasbliss.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Serve product images directly from disk — bypasses Node.js entirely.
    # Next.js image optimisation is disabled (unoptimized: true in next.config.js)
    # so the browser requests these URLs directly. Nginx serves them in <5ms.
    location /uploads/ {
        alias /home/YOUR_USER/krishnabyrr/api/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
        gzip_static on;
    }

    # Next.js static assets — long-lived, content-hashed filenames
    location /_next/static/ {
        proxy_pass         http://127.0.0.1:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
