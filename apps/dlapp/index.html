<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Krishna's Bliss — Get the App</title>
  <meta name="description" content="Download the Krishna's Bliss app for the best shopping experience." />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:   #FAF7F2;
      --teal:    #1A6B6B;
      --teal-dk: #145555;
      --charcoal:#2D2D2D;
      --muted:   #6B7280;
      --gold:    #BF9B30;
      --navy:    #012169;
    }

    body {
      min-height: 100dvh;
      background: var(--cream);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: var(--charcoal);
    }

    /* ── Logo medallion ── */
    .medallion {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(145deg, #01327a 0%, #012169 55%, #010d3d 100%);
      border: 1.5px solid var(--gold);
      box-shadow:
        0 10px 30px rgba(1,33,105,0.45),
        0 2px 6px rgba(0,0,0,0.3),
        inset 0 1px 3px rgba(255,255,255,0.15),
        inset 0 -2px 5px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .medallion img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ── Card ── */
    .card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 40px 32px 32px;
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      margin-top: -20px; /* medallion overlaps top */
      padding-top: 56px;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 420px;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--charcoal);
      text-align: center;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 0.875rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    /* ── Store buttons ── */
    .stores {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .store-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
      position: relative;
      overflow: hidden;
    }
    .store-btn:hover  { transform: translateY(-2px); }
    .store-btn:active { transform: translateY(0); opacity: 0.9; }

    .store-btn.play {
      background: #fff;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
      border: 1.5px solid #e5e7eb;
      color: var(--charcoal);
    }
    .store-btn.appstore {
      background: #000;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
      color: #fff;
    }
    .store-btn:hover.play     { box-shadow: 0 6px 20px rgba(0,0,0,0.14); }
    .store-btn:hover.appstore { box-shadow: 0 6px 20px rgba(0,0,0,0.35); }

    .store-icon {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }

    .store-text {
      display: flex;
      flex-direction: column;
      text-align: left;
    }
    .store-pre {
      font-size: 0.7rem;
      font-weight: 400;
      opacity: 0.75;
      line-height: 1;
      margin-bottom: 2px;
    }
    .store-name {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1;
    }

    /* ── Redirecting state ── */
    .redirect-msg {
      text-align: center;
    }
    .redirect-msg p {
      font-size: 0.875rem;
      color: var(--muted);
      margin-top: 16px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(26,107,107,0.2);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    .footer {
      margin-top: 28px;
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
    }
    .footer a { color: var(--teal); text-decoration: none; }
    .footer a:hover { text-decoration: underline; }

    /* ── Hidden until JS populates ── */
    [hidden] { display: none !important; }
  </style>
</head>
<body>

<div class="wrapper">
  <!-- Medallion sits above the card -->
  <div class="medallion">
    <img src="https://krishnasbliss.com/logo-krishnas-bliss.png" alt="Krishna's Bliss" />
  </div>

  <div class="card">
    <!-- Detecting / redirecting state -->
    <div id="state-detecting">
      <div class="spinner"></div>
    </div>

    <!-- Redirecting state (platform detected) -->
    <div id="state-redirecting" hidden class="redirect-msg">
      <h1>Opening store&hellip;</h1>
      <p>Taking you to the right store. If nothing happens,<br>
        use the buttons below.</p>
      <div style="margin-top:20px" id="fallback-stores"></div>
    </div>

    <!-- Picker state (platform not detected or both stores available) -->
    <div id="state-picker" hidden>
      <h1>Get the App</h1>
      <p class="sub">Shop our curated collection of handcrafted Indian ethnic wear — anytime, anywhere.</p>
      <div class="stores" id="picker-stores"></div>
    </div>
  </div>

  <p class="footer">
    <a href="https://krishnasbliss.com">krishnasbliss.com</a>
  </p>
</div>

<script>
(function () {
  const API = 'https://krishnasbliss.com/api/app-links';

  // ── Platform detection ────────────────────────────────────────────────────
  const ua = navigator.userAgent || '';
  const isAndroid = /android/i.test(ua);
  const isIOS     = /iphone|ipad|ipod/i.test(ua) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  // ── Build a store button element ──────────────────────────────────────────
  function makeStoreBtn(type, url) {
    const a = document.createElement('a');
    a.href   = url;
    a.target = '_blank';
    a.rel    = 'noopener noreferrer';
    a.className = 'store-btn ' + (type === 'ios' ? 'appstore' : 'play');

    if (type === 'ios') {
      a.innerHTML = `
        <!-- Apple logo SVG -->
        <svg class="store-icon" viewBox="0 0 36 36" fill="none">
          <path fill="#fff" d="M26.27 19.17c-.03-3.23 2.64-4.78 2.76-4.86-1.51-2.2-3.85-2.5-4.68-2.53-1.98-.2-3.88 1.17-4.89 1.17-1.02 0-2.57-1.15-4.24-1.12-2.16.03-4.17 1.26-5.28 3.18-2.27 3.93-.58 9.73 1.61 12.91 1.08 1.56 2.36 3.3 4.03 3.24 1.63-.07 2.24-1.04 4.21-1.04 1.97 0 2.53 1.04 4.25 1 1.75-.03 2.85-1.57 3.91-3.14a14.03 14.03 0 001.77-3.63c-.04-.02-3.41-1.31-3.45-5.18zm-3.23-9.53c.89-1.08 1.49-2.57 1.33-4.06-1.28.05-2.85.85-3.77 1.91-.82.95-1.55 2.48-1.36 3.94 1.43.11 2.89-.72 3.8-1.79z"/>
        </svg>
        <span class="store-text">
          <span class="store-pre">Download on the</span>
          <span class="store-name">App Store</span>
        </span>`;
    } else {
      a.innerHTML = `
        <!-- Google Play colourful logo -->
        <svg class="store-icon" viewBox="0 0 36 36">
          <path fill="#EA4335" d="M7.5 6.3 20.6 18 7.5 29.7A2 2 0 0 1 7 28.5v-21a2 2 0 0 1 .5-1.2z"/>
          <path fill="#FBBC04" d="M25.5 14.5 22 12.6 7.5 6.3a2 2 0 0 1 2-.3l17.2 9.4-1.2-1z"/>
          <path fill="#4285F4" d="M25.5 21.5l-1.2 1L7.5 29.7a2 2 0 0 1-2-.3L22 23.4l3.5-1.9z"/>
          <path fill="#34A853" d="M29 18a2 2 0 0 1-1 1.7l-2.5 1.4L22 18l3.5-2.1 2.5 1.4A2 2 0 0 1 29 18z"/>
        </svg>
        <span class="store-text">
          <span class="store-pre">Get it on</span>
          <span class="store-name">Google Play</span>
        </span>`;
    }
    return a;
  }

  // ── Render logic ──────────────────────────────────────────────────────────
  function showPicker(android, ios) {
    const container = document.getElementById('picker-stores');
    if (ios)     container.appendChild(makeStoreBtn('ios',     ios));
    if (android) container.appendChild(makeStoreBtn('android', android));
    document.getElementById('state-detecting').hidden  = true;
    document.getElementById('state-picker').hidden     = false;
  }

  function showRedirecting(targetUrl, android, ios) {
    // Put fallback buttons below the message
    const fb = document.getElementById('fallback-stores');
    if (ios)     fb.appendChild(makeStoreBtn('ios',     ios));
    if (android) fb.appendChild(makeStoreBtn('android', android));

    document.getElementById('state-detecting').hidden   = true;
    document.getElementById('state-redirecting').hidden = false;

    // Redirect after a short tick so the UI renders first
    setTimeout(function () { window.location.href = targetUrl; }, 200);
  }

  // ── Fetch links and decide ─────────────────────────────────────────────────
  fetch(API)
    .then(function (r) { return r.json(); })
    .then(function (body) {
      var android = body.data && body.data.android_url;
      var ios     = body.data && body.data.ios_url;

      if (isAndroid && android) {
        showRedirecting(android, android, ios);
      } else if (isIOS && ios) {
        showRedirecting(ios, android, ios);
      } else {
        showPicker(android, ios);
      }
    })
    .catch(function () {
      // API unreachable — show empty picker (no buttons), let user try again
      showPicker(null, null);
      document.querySelector('.sub').textContent =
        'Could not load store links. Please try again later or visit krishnasbliss.com.';
    });
})();
</script>

</body>
</html>
