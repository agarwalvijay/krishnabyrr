<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer gold ring -->
  <ellipse cx="16" cy="16" rx="15" ry="15" fill="none" stroke="#C8971A" stroke-width="1.5"/>
  <!-- Gold wash -->
  <ellipse cx="16" cy="16" rx="13" ry="13" fill="#C8971A" opacity="0.15"/>
  <!-- Teal ring -->
  <ellipse cx="16" cy="16" rx="10" ry="10" fill="none" stroke="#5BBCB0" stroke-width="1.5"/>
  <!-- Deep blue core -->
  <ellipse cx="16" cy="16" rx="7" ry="7" fill="#1E3F8B" opacity="0.9"/>
  <!-- Teal pupil -->
  <ellipse cx="16" cy="16" rx="3.5" ry="3.5" fill="#5BBCB0"/>
  <!-- Catch-light -->
  <ellipse cx="14.5" cy="14.5" rx="1.2" ry="0.9" fill="white" opacity="0.9"/>
</svg>
